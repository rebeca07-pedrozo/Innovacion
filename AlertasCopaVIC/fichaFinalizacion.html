<!DOCTYPE html>
<html>
<head><base target="_top"><meta charset="utf-8">
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f2f3f5;margin:0;padding:50px 16px;}
  .card{max-width:460px;margin:0 auto;background:#fff;border:1px solid #e6e6e6;border-radius:10px;overflow:hidden;}
  .head{background:#ED1C27;color:#fff;padding:16px 20px;}
  .head img{height:26px;vertical-align:middle;margin-right:10px}
  .head span{font-size:16px;font-weight:bold;vertical-align:middle}
  .body{padding:24px 22px;color:#333}
  label{display:block;font-size:13px;color:#555;margin:14px 0 5px}
  input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;font-family:Arial}
  .btn{margin-top:20px;width:100%;background:#ED1C27;color:#fff;border:0;padding:13px;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer}
  .muted{font-size:12px;color:#999;margin-top:12px}
</style></head>
<body>
  <div class="card">
    <div class="head">
      <img src="https://lh3.googleusercontent.com/d/1-yqbDOFcf0WNPG935xahfwZAS2T18zFE" alt="Davivienda">
      <span>Ficha de finalización</span>
    </div>
    <div class="body">
      <p style="margin:0 0 6px;font-size:14px;">Confirma los datos de presentación de la obligación <b><?= id ?></b>.</p>
      <form action="<?= url ?>" method="get">
        <input type="hidden" name="id" value="<?= id ?>">
        <input type="hidden" name="estado" value="Presentado">
        <input type="hidden" name="confirmar" value="1">
        <label>Fecha en que se presentó</label>
        <input type="date" name="fecha" value="<?= hoy ?>" required>
        <label>Número de radicado DIAN (opcional)</label>
        <input type="text" name="radicado" placeholder="Ej. 91000123456789">
        <label>Observación (opcional)</label>
        <textarea name="obs" rows="3" placeholder="Comentario..."></textarea>
        <button class="btn" type="submit">Guardar y marcar como presentado</button>
        <p class="muted">Al guardar, esta obligación quedará cerrada y no recibirás más alertas.</p>
      </form>
    </div>
  </div>
</body>
</html>
