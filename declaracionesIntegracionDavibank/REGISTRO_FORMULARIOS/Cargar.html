<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    color: #222;
    background: #FFF;
    min-height: 100vh;
  }

  /* ---------- Barra superior ---------- */
  .barra {
    background: linear-gradient(180deg, #731919, #e52b2b);
    color: #FFF;
    padding: clamp(10px, 1.6vw, 18px) clamp(14px, 2.4vw, 34px);
    display: flex;
    align-items: center;
    gap: clamp(12px, 2vw, 26px);
  }
  .barra .logo { height: clamp(24px, 3.4vw, 44px); width: auto; display: block; }
  .barra .titulo { font-size: clamp(13px, 1.9vw, 26px); font-weight: 400; }

  /* ---------- Contenido ---------- */
  .contenido {
    padding: clamp(14px, 2vw, 26px) clamp(14px, 4vw, 60px);
    max-width: 1400px;
  }

  .ruta {
    font-size: clamp(11px, 1.15vw, 16px);
    color: #555;
    margin: 0 0 clamp(16px, 2.2vw, 30px);
  }
  .ruta a { color: #555; text-decoration: none; cursor: pointer; }
  .ruta a:hover { color: #e52b2b; text-decoration: underline; }

  /* ---------- Distribución ---------- */
  .columnas {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: clamp(18px, 3vw, 44px);
    align-items: start;
  }

  /* ---------- Campos ---------- */
  .campo { margin-bottom: clamp(12px, 1.6vw, 20px); }
  .campo label {
    display: block;
    font-size: clamp(12px, 1.25vw, 17px);
    font-weight: 700;
    margin-bottom: clamp(5px, 0.6vw, 9px);
  }
  select {
    width: 100%;
    max-width: 340px;
    padding: clamp(7px, 0.9vw, 12px) clamp(9px, 1vw, 14px);
    border: 2px solid #222;
    border-radius: 3px;
    font-size: clamp(12px, 1.2vw, 16px);
    font-weight: 700;
    font-family: inherit;
    background: #FFF;
    cursor: pointer;
  }
  select:focus { outline: 2px solid #e52b2b; outline-offset: 1px; }

  .caja {
    width: 100%;
    border: 1px solid #AAA;
    border-radius: 3px;
    background: #FFF;
    padding: clamp(7px, 0.9vw, 12px) clamp(9px, 1vw, 14px);
    font-size: clamp(12px, 1.2vw, 16px);
    min-height: clamp(34px, 3.4vw, 46px);
  }
  .caja-detalle {
    min-height: clamp(110px, 13vw, 180px);
    max-height: clamp(180px, 22vw, 300px);
    overflow-y: auto;
    font-size: clamp(11px, 1.1vw, 14px);
    line-height: 1.5;
  }

  /* ---------- Zona de carga ---------- */
  .zona {
    border: 1px solid #B8CFA0;
    background: #EAF3DE;
    border-radius: 3px;
    aspect-ratio: 4 / 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 1.4vw, 18px);
    cursor: pointer;
    text-align: center;
    padding: clamp(12px, 1.6vw, 22px);
    transition: background 0.15s ease;
  }
  .zona:hover { background: #DEEBCD; }
  .zona.activa { background: #D2E5BC; border-color: #8FB56A; }

  .zona .nube {
    font-size: clamp(48px, 7vw, 100px);
    line-height: 1;
    color: #1A1A1A;
  }
  .zona .pie {
    font-size: clamp(10px, 1.05vw, 14px);
    color: #333;
  }
  .zona .nombre-archivo {
    font-size: clamp(10px, 1.05vw, 14px);
    font-weight: 700;
    color: #2F5218;
    word-break: break-all;
  }

  .acciones {
    display: flex;
    gap: clamp(6px, 0.9vw, 12px);
    justify-content: flex-end;
    margin-top: clamp(8px, 1.1vw, 14px);
  }
  .btn {
    background: #F2F2F2;
    border: 1px solid #999;
    border-radius: 3px;
    color: #333;
    font-size: clamp(10px, 1.05vw, 14px);
    font-family: inherit;
    padding: clamp(7px, 0.9vw, 12px) clamp(14px, 1.8vw, 26px);
    cursor: pointer;
  }
  .btn:hover { background: #E4E4E4; }
  .btn:disabled { color: #AAA; cursor: not-allowed; background: #F8F8F8; }

  /* ---------- Estados ---------- */
  .est-ok  { color: #2E6B2E; font-weight: 700; }
  .est-mal { color: #B0151B; font-weight: 700; }
  .est-esp { color: #7D6608; font-weight: 700; }
  .est-neutro { color: #777; }

  .linea-error {
    padding: clamp(4px, 0.5vw, 7px) 0;
    border-bottom: 1px solid #EEE;
  }
  .linea-error:last-child { border-bottom: none; }

  .oculto { display: none; }

  @media (max-width: 760px) {
    .columnas { grid-template-columns: 1fr; }
    .zona { aspect-ratio: 16 / 9; }
  }
</style>
</head>
<body>

<div class="barra">
  <img class="logo" src="PEGAR_AQUI_LOGO_DAVIVIENDA" alt="Davivienda">
  <span class="titulo">Sistema de declaraciones - Integración Davibank</span>
</div>

<div class="contenido">

  <p class="ruta"><a onclick="volverInicio()">Inicio</a> &gt; Cargar declaración</p>

  <div class="columnas">

    <div>
      <div class="campo">
        <label for="c-entidad">Entidad</label>
        <select id="c-entidad"></select>
      </div>

      <div class="campo">
        <label>Estado:</label>
        <div class="caja" id="c-estado">&nbsp;</div>
      </div>

      <div class="campo">
        <label>Detalle</label>
        <div class="caja caja-detalle" id="c-detalle">&nbsp;</div>
      </div>
    </div>

    <div>
      <div class="zona" id="c-zona"
           onclick="document.getElementById('c-archivo').click()">
        <div class="nube">&#9729;</div>
        <div class="pie" id="c-pie">Dejar archivo formato .xlsx o .xls</div>
      </div>

      <input type="file" id="c-archivo" accept=".xlsx,.xls"
             class="oculto" onchange="seleccionar()">

      <div class="acciones">
        <button class="btn" id="c-confirmar" onclick="enviarCarga()">CONFIRMAR</button>
        <button class="btn" onclick="limpiar()">CARGAR DE NUEVO</button>
      </div>
    </div>

  </div>

</div>

<script>
  var ARCHIVO = null;

  google.script.run
    .withSuccessHandler(iniciar)
    .withFailureHandler(mostrarFallo)
    .obtenerDatosIniciales();

  function iniciar(datos) {
    var sel = document.getElementById('c-entidad');
    sel.innerHTML = '';
    datos.entidades.forEach(function (e) {
      var op = document.createElement('option');
      op.value = e.codigo;
      op.textContent = e.nombre;
      sel.appendChild(op);
    });
  }

  // ---------- Selección de archivo ----------

  function seleccionar() {
    var input = document.getElementById('c-archivo');
    if (!input.files.length) return;

    ARCHIVO = input.files[0];
    document.getElementById('c-pie').innerHTML =
      '<span class="nombre-archivo">' + ARCHIVO.name + '</span>';
    document.getElementById('c-estado').innerHTML =
      '<span class="est-neutro">Archivo listo para confirmar</span>';
    document.getElementById('c-detalle').innerHTML = '&nbsp;';
  }

  function limpiar() {
    ARCHIVO = null;
    document.getElementById('c-archivo').value = '';
    document.getElementById('c-pie').textContent = 'Dejar archivo formato .xlsx o .xls';
    document.getElementById('c-estado').innerHTML = '&nbsp;';
    document.getElementById('c-detalle').innerHTML = '&nbsp;';
    document.getElementById('c-confirmar').disabled = false;
    document.getElementById('c-zona').classList.remove('activa');
  }

  // ---------- Arrastrar y soltar ----------

  var zona = document.getElementById('c-zona');

  ['dragenter', 'dragover'].forEach(function (evento) {
    zona.addEventListener(evento, function (e) {
      e.preventDefault();
      zona.classList.add('activa');
    });
  });

  ['dragleave', 'drop'].forEach(function (evento) {
    zona.addEventListener(evento, function (e) {
      e.preventDefault();
      zona.classList.remove('activa');
    });
  });

  zona.addEventListener('drop', function (e) {
    if (!e.dataTransfer.files.length) return;

    var archivo = e.dataTransfer.files[0];
    var nombre = archivo.name.toLowerCase();

    if (nombre.slice(-5) !== '.xlsx' && nombre.slice(-4) !== '.xls') {
      document.getElementById('c-estado').innerHTML =
        '<span class="est-mal">Formato no admitido. Se espera .xlsx o .xls</span>';
      return;
    }

    ARCHIVO = archivo;
    document.getElementById('c-pie').innerHTML =
      '<span class="nombre-archivo">' + archivo.name + '</span>';
    document.getElementById('c-estado').innerHTML =
      '<span class="est-neutro">Archivo listo para confirmar</span>';
    document.getElementById('c-detalle').innerHTML = '&nbsp;';
  });

  // ---------- Envío ----------

  function enviarCarga() {
    if (!ARCHIVO) {
      document.getElementById('c-estado').innerHTML =
        '<span class="est-mal">Selecciona un archivo primero</span>';
      return;
    }

    var boton = document.getElementById('c-confirmar');
    boton.disabled = true;

    document.getElementById('c-estado').innerHTML =
      '<span class="est-neutro">Procesando y validando…</span>';
    document.getElementById('c-detalle').innerHTML = '&nbsp;';

    var lector = new FileReader();

    lector.onload = function (ev) {
      var base64 = ev.target.result.split(',')[1];

      google.script.run
        .withSuccessHandler(function (r) { pintarResultado(r); boton.disabled = false; })
        .withFailureHandler(function (e) { mostrarFallo(e); boton.disabled = false; })
        .recibirCarga(base64, ARCHIVO.name);
    };

    lector.readAsDataURL(ARCHIVO);
  }

  function pintarResultado(r) {
    var estado = document.getElementById('c-estado');
    var detalle = document.getElementById('c-detalle');

    if (!r.ok) {
      estado.innerHTML = '<span class="est-mal">No se pudo procesar</span>';
      detalle.textContent = r.mensaje;
      return;
    }

    if (r.estado === 'APROBADO') {
      estado.innerHTML = '<span class="est-ok">Aprobado</span> · ' + r.radicado;
      detalle.textContent = r.resumen;
      return;
    }

    estado.innerHTML = '<span class="est-mal">Rechazado</span> · ' +
                       r.errores.length + ' inconsistencias';

    var html = '<div style="margin-bottom:6px;">' + r.resumen + '</div>';
    r.errores.forEach(function (e) {
      html += '<div class="linea-error">' + e.mensaje + '</div>';
    });
    detalle.innerHTML = html;
  }

  function volverInicio() {
    alert('Volver a inicio (pendiente de conectar)');
  }

  function mostrarFallo(e) {
    document.getElementById('c-estado').innerHTML =
      '<span class="est-mal">Ocurrió un problema</span>';
    document.getElementById('c-detalle').textContent = e.message;
  }
</script>

</body>
</html>
