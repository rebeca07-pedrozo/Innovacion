<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    color: #222;
    background: #FFF;
    min-height: 100vh;
  }

  /* ---------- Barra superior ---------- */
  .barra {
    background: linear-gradient(180deg, #731919, #e52b2b);
    color: #FFF;
    padding: clamp(10px, 1.6vw, 18px) clamp(14px, 2.4vw, 34px);
    display: flex;
    align-items: center;
    gap: clamp(12px, 2vw, 26px);
  }
  .barra .logo {
    height: clamp(24px, 3.4vw, 44px);
    width: auto;
    display: block;
  }
  .barra .titulo {
    font-size: clamp(13px, 1.9vw, 26px);
    font-weight: 400;
  }

  /* ---------- Contenido ---------- */
  .contenido {
    padding: clamp(18px, 3vw, 44px) clamp(14px, 4vw, 60px);
  }
  .saludo {
    font-size: clamp(13px, 1.4vw, 19px);
    font-weight: 400;
    color: #444;
    margin: 0 0 clamp(16px, 2.4vw, 32px);
  }

  /* ---------- Tarjetas ---------- */
  .tarjetas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: clamp(14px, 2.2vw, 32px);
    max-width: 1400px;
  }

  .tarjeta {
    position: relative;
    background: #F7EDEC;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 5 / 4;
    cursor: pointer;
    border: none;
    padding: 0;
    width: 100%;
    font-family: inherit;
    transition: transform 0.15s ease;
  }
  .tarjeta:hover { transform: translateY(-3px); }
  .tarjeta:focus-visible { outline: 3px solid #731919; outline-offset: 2px; }

  .rotulo {
    position: absolute;
    z-index: 4;
    top: clamp(10px, 1.4vw, 18px);
    left: clamp(12px, 1.6vw, 22px);
    font-size: clamp(14px, 1.6vw, 22px);
    font-weight: 700;
    color: #222;
    margin: 0;
  }

  /* Cuarto de círculo desde la esquina inferior izquierda */
  .arco {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 82%;
    height: 82%;
    border-top-right-radius: 100%;
    z-index: 1;
  }

  .icono {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: clamp(48px, 6.5vw, 96px);
    height: auto;
  }

  .accion {
    position: absolute;
    z-index: 3;
    left: 50%;
    bottom: clamp(10px, 1.6vw, 22px);
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.88);
    border: none;
    border-radius: 999px;
    padding: clamp(7px, 0.9vw, 12px) clamp(16px, 2vw, 30px);
    font-size: clamp(11px, 1.15vw, 16px);
    font-family: inherit;
    color: #222;
    white-space: nowrap;
    cursor: pointer;
  }
  .tarjeta:hover .accion { background: #FFF; }

  /* Colores translúcidos para que la ilustración se lea sobre el arco */
  .t-naranja .arco { background: rgba(245, 168, 28, 0.62); }
  .t-morado  .arco { background: rgba(91, 24, 232, 0.55); }
  .t-rojo    .arco { background: rgba(232, 17, 45, 0.58); }

  @media (max-width: 620px) {
    .tarjeta { aspect-ratio: 16 / 10; }
  }
</style>
</head>
<body>

<div class="barra">
  <img class="logo" src="PEGAR_AQUI_LOGO_DAVIVIENDA" alt="Davivienda">
  <span class="titulo">Sistema de declaraciones - Integración Davibank</span>
</div>

<div class="contenido">
  <p class="saludo" id="saludo">Bienvenido/a.</p>

  <div class="tarjetas">

    <button class="tarjeta t-naranja" onclick="irA('generar')">
      <span class="rotulo">Generar plantilla</span>
      <span class="arco"></span>
      <img class="icono" src="PEGAR_AQUI_ICONO_GENERAR" alt="">
      <span class="accion">Ir a generar plantilla</span>
    </button>

    <button class="tarjeta t-morado" onclick="irA('cargar')">
      <span class="rotulo">Cargar declaración</span>
      <span class="arco"></span>
      <img class="icono" src="PEGAR_AQUI_ICONO_CARGAR" alt="">
      <span class="accion">Ir a cargar declaración</span>
    </button>

    <button class="tarjeta t-rojo" onclick="irA('consolidar')">
      <span class="rotulo">Consolidar</span>
      <span class="arco"></span>
      <img class="icono" src="PEGAR_AQUI_ICONO_CONSOLIDAR" alt="">
      <span class="accion">Ir a consolidar</span>
    </button>

  </div>
</div>

<script>
  google.script.run.withSuccessHandler(function (datos) {
    document.getElementById('saludo').textContent = 'Bienvenido/a, ' + datos.usuario + '.';
  }).obtenerDatosIniciales();

  function irA(vista) {
    alert('Vista: ' + vista);
  }
</script>

</body>
</html>
