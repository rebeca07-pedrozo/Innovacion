<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    color: #222;
    background: #FFF;
    min-height: 100vh;
  }

  /* ---------- Barra superior ---------- */
  .barra {
    background: linear-gradient(180deg, #731919, #e52b2b);
    color: #FFF;
    padding: clamp(10px, 1.6vw, 18px) clamp(14px, 2.4vw, 34px);
    display: flex;
    align-items: center;
    gap: clamp(12px, 2vw, 26px);
  }
  .barra .logo { height: clamp(24px, 3.4vw, 44px); width: auto; display: block; }
  .barra .titulo { font-size: clamp(13px, 1.9vw, 26px); font-weight: 400; }

  /* ---------- Contenido ---------- */
  .contenido {
    padding: clamp(14px, 2vw, 26px) clamp(14px, 4vw, 60px);
    max-width: 1400px;
  }

  .ruta {
    font-size: clamp(11px, 1.15vw, 16px);
    color: #555;
    margin: 0 0 clamp(14px, 2vw, 26px);
  }
  .ruta a { color: #555; text-decoration: none; cursor: pointer; }
  .ruta a:hover { color: #e52b2b; text-decoration: underline; }

  /* ---------- Paneles ---------- */
  .panel {
    background: #F7EDEC;
    border-radius: 4px;
    padding: clamp(12px, 1.6vw, 22px) clamp(14px, 2vw, 26px);
    margin-bottom: clamp(14px, 2vw, 26px);
  }

  .campos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: clamp(12px, 1.8vw, 26px);
  }
  .campo label {
    display: block;
    font-size: clamp(12px, 1.25vw, 17px);
    font-weight: 700;
    margin-bottom: clamp(5px, 0.6vw, 9px);
  }
  select {
    width: 100%;
    padding: clamp(7px, 0.9vw, 12px) clamp(9px, 1vw, 14px);
    border: 2px solid #222;
    border-radius: 3px;
    font-size: clamp(12px, 1.2vw, 16px);
    font-family: inherit;
    background: #FFF;
    cursor: pointer;
  }
  select:focus { outline: 2px solid #e52b2b; outline-offset: 1px; }

  /* ---------- Resultado ---------- */
  .rotulo-resultado {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: clamp(12px, 1.2vw, 16px);
    font-weight: 700;
    margin-bottom: clamp(10px, 1.3vw, 16px);
  }

  .franja {
    background: #A8C4DE;
    border-radius: 3px;
    padding: clamp(10px, 1.3vw, 16px) clamp(12px, 1.6vw, 20px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(12px, 2vw, 26px);
    flex-wrap: wrap;
  }
  .franja .identificador {
    font-size: clamp(13px, 1.35vw, 19px);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .franja .meta {
    font-size: clamp(9px, 0.9vw, 12px);
    font-weight: 700;
    line-height: 1.6;
    color: #1E3A52;
  }

  .btn-descargar {
    background: #C5E0A5;
    border: none;
    border-radius: 3px;
    color: #2F5218;
    font-size: clamp(11px, 1.1vw, 15px);
    font-weight: 700;
    font-family: inherit;
    padding: clamp(8px, 1vw, 13px) clamp(16px, 2vw, 28px);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-descargar:hover { background: #B0D48C; }

  .btn-rojo {
    background: #e52b2b;
    border: none;
    border-radius: 3px;
    color: #FFF;
    font-size: clamp(11px, 1.1vw, 15px);
    font-weight: 700;
    font-family: inherit;
    padding: clamp(8px, 1vw, 13px) clamp(16px, 2vw, 28px);
    cursor: pointer;
  }
  .btn-rojo:hover { background: #C4151C; }

  .btn-claro {
    background: #FFF;
    border: 1px solid #999;
    border-radius: 3px;
    color: #333;
    font-size: clamp(10px, 1vw, 14px);
    font-family: inherit;
    padding: clamp(6px, 0.8vw, 10px) clamp(12px, 1.6vw, 22px);
    cursor: pointer;
  }
  .btn-claro:hover { background: #F0F0F0; }

  .aviso-vacio {
    font-size: clamp(12px, 1.2vw, 16px);
    margin: 0 0 clamp(12px, 1.6vw, 20px);
  }
  .cargando {
    font-size: clamp(12px, 1.2vw, 16px);
    color: #777;
    margin: 0;
  }
  .pie-acciones {
    margin-top: clamp(10px, 1.3vw, 16px);
    display: flex;
    justify-content: flex-end;
  }
</style>
</head>
<body>

<div class="barra">
  <img class="logo" src="PEGAR_AQUI_LOGO_DAVIVIENDA" alt="Davivienda">
  <span class="titulo">Sistema de declaraciones - Integración Davibank</span>
</div>

<div class="contenido">

  <p class="ruta"><a onclick="volverInicio()">Inicio</a> &gt; Generar plantilla</p>

  <div class="panel">
    <div class="campos">
      <div class="campo">
        <label for="g-formulario">Formulario</label>
        <select id="g-formulario" onchange="consultarPlantilla()"></select>
      </div>
      <div class="campo">
        <label for="g-entidad">Entidad</label>
        <select id="g-entidad" onchange="consultarPlantilla()"></select>
      </div>
      <div class="campo">
        <label for="g-periodo">Periodo</label>
        <select id="g-periodo" onchange="consultarPlantilla()"></select>
      </div>
    </div>
  </div>

  <div id="g-resultado"></div>

</div>

<script>
  google.script.run
    .withSuccessHandler(iniciar)
    .withFailureHandler(mostrarFallo)
    .obtenerDatosIniciales();

  function iniciar(datos) {
    llenar('g-formulario', datos.formularios, 'codigo', 'nombre');
    llenar('g-entidad',    datos.entidades,   'codigo', 'nombre');
    llenar('g-periodo',    datos.periodos,    'valor',  'texto');
    consultarPlantilla();
  }

  function llenar(id, lista, campoValor, campoTexto) {
    var sel = document.getElementById(id);
    sel.innerHTML = '';
    lista.forEach(function (item) {
      var op = document.createElement('option');
      op.value = item[campoValor];
      op.textContent = item[campoTexto];
      sel.appendChild(op);
    });
  }

  function consultarPlantilla() {
    var f = document.getElementById('g-formulario').value;
    var e = document.getElementById('g-entidad').value;
    var p = document.getElementById('g-periodo').value;
    if (!f || !e || !p) return;

    document.getElementById('g-resultado').innerHTML =
      '<div class="panel"><p class="cargando">Consultando…</p></div>';

    google.script.run
      .withSuccessHandler(pintarResultado)
      .withFailureHandler(mostrarFallo)
      .buscarPlantillaExistente(f, e, p);
  }

  function pintarResultado(r) {
    var html = '<div class="panel">';

    if (r.encontrada) {
      html +=
        '<div class="rotulo-resultado">' +
          '<span>&#128203;</span>' +
          '<span>Ya existe una plantilla para esta combinación</span>' +
        '</div>' +
        '<div class="franja">' +
          '<div>' +
            '<div class="identificador">' + r.idPlantilla + '</div>' +
            '<div class="meta">' +
              'Generada por: ' + r.generadaPor + '<br>' +
              'Fecha de creación: ' + r.fecha +
            '</div>' +
          '</div>' +
          '<button class="btn-descargar" onclick="abrir(\'' + r.urlDescarga + '\')">' +
            'DESCARGAR</button>' +
        '</div>' +
        '<div class="pie-acciones">' +
          '<button class="btn-claro" onclick="generarNueva()">Generar nueva</button>' +
        '</div>';
    } else {
      html +=
        '<p class="aviso-vacio">No hay una plantilla generada para esta combinación.</p>' +
        '<button class="btn-rojo" onclick="generarNueva()">GENERAR PLANTILLA</button>';
    }

    html += '</div>';
    document.getElementById('g-resultado').innerHTML = html;
  }

  function generarNueva() {
    var f = document.getElementById('g-formulario').value;
    var e = document.getElementById('g-entidad').value;
    var p = document.getElementById('g-periodo').value;

    document.getElementById('g-resultado').innerHTML =
      '<div class="panel"><p class="cargando">Generando plantilla…</p></div>';

    google.script.run
      .withSuccessHandler(pintarResultado)
      .withFailureHandler(mostrarFallo)
      .generarPlantillaDesdeWeb(f, e, p);
  }

  function abrir(url) { window.open(url, '_blank'); }

  function volverInicio() {
    alert('Volver a inicio (pendiente de conectar)');
  }

  function mostrarFallo(e) {
    document.getElementById('g-resultado').innerHTML =
      '<div class="panel"><p class="cargando">Ocurrió un problema: ' + e.message + '</p></div>';
  }
</script>

</body>
</html>
